name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    # ubuntu-latest (26.04) has no Python 3.9 build for setup-python; 3.9 is still supported by the kit.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install official kit
        run: bash scripts/setup.sh
      - name: Run offline tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Exercise offline demo and command interfaces
        run: |
          .venv/bin/python dispatch.py --demo --log runs/demo.jsonl
          .venv/bin/python dispatch.py --help
          .venv/bin/python compare.py run --help
          .venv/bin/python compare.py report --help
