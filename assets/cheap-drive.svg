<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Cheap-Drive</title>
  <desc id="description">A bright red car speeding to the right with orange and yellow flames streaming behind it, on a dark rounded square.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="560" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#222B40"/>
      <stop offset="1" stop-color="#101625"/>
    </linearGradient>
    <linearGradient id="fire" x1="64" y1="260" x2="285" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFAA32"/>
      <stop offset="1" stop-color="#FF4B22"/>
    </linearGradient>
    <linearGradient id="paint" x1="385" y1="290" x2="385" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF474B"/>
      <stop offset="1" stop-color="#D71937"/>
    </linearGradient>
    <linearGradient id="glass" x1="341" y1="247" x2="444" y2="301" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4F1F6"/>
      <stop offset="1" stop-color="#65B4CF"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="624" height="624" rx="144" fill="url(#background)"/>
  <path d="M123 480H554" stroke="#374158" stroke-width="12" stroke-linecap="round"/>
  <path d="M81 480H95M157 510H238M269 510H307" stroke="#374158" stroke-width="8" stroke-linecap="round"/>

  <!-- The flame tips point backwards; the car moves to the right. -->
  <path d="M271 417C213 440 153 430 112 398C141 404 160 393 168 380C112 375 75 345 59 309C96 332 125 330 145 318C102 291 80 252 83 215C115 260 155 261 181 280C174 252 174 225 184 202C205 259 237 280 256 308C277 339 298 390 271 417Z" fill="url(#fire)"/>
  <path d="M261 403C220 417 183 409 159 394C185 392 201 382 201 367C164 361 138 342 125 322C153 332 173 328 187 319C171 300 166 282 168 268C189 298 223 310 241 334C259 358 272 383 261 403Z" fill="#FFCA49"/>
  <path d="M257 389C231 397 212 389 201 379C219 379 227 370 224 359C216 345 207 334 197 327C222 332 246 348 257 367C263 378 264 384 257 389Z" fill="#FFF0A6"/>
  <path d="M66 387L96 401M124 245L133 258" stroke="#FFAE38" stroke-width="9" stroke-linecap="round"/>

  <!-- Roof and windows. -->
  <path d="M271 308L315 245C325 231 337 225 356 225H430C445 225 454 232 464 244L516 307" fill="#EF3346" stroke="#101625" stroke-width="12" stroke-linejoin="round"/>
  <path d="M297 304L332 253C335 248 341 246 349 246H371V304H297Z" fill="url(#glass)"/>
  <path d="M386 246H427C434 246 439 249 443 255L484 304H386V246Z" fill="url(#glass)"/>
  <path d="M341 257L318 292M411 257L438 292" stroke="#E3FAFF" stroke-width="6" stroke-linecap="round" opacity=".65"/>

  <!-- Body, small rear spoiler, lights and trim. -->
  <path d="M224 298H267" stroke="#101625" stroke-width="13" stroke-linecap="round"/>
  <path d="M237 300V318" stroke="#101625" stroke-width="10"/>
  <path d="M238 310H497L543 327C558 333 566 346 566 362V399C566 414 555 425 540 425H238C223 425 211 414 211 399V339C211 323 222 310 238 310Z" fill="url(#paint)" stroke="#101625" stroke-width="12" stroke-linejoin="round"/>
  <path d="M237 333H488" stroke="#FF8A87" stroke-width="8" stroke-linecap="round"/>
  <path d="M389 344V391" stroke="#AD1931" stroke-width="6" stroke-linecap="round"/>
  <path d="M403 350H423" stroke="#101625" stroke-width="6" stroke-linecap="round"/>
  <path d="M217 350H233V372H217" fill="#FFAC4D"/>
  <path d="M536 347H560V367H536C531 367 528 363 528 357C528 351 531 347 536 347Z" fill="#FFF0BE"/>
  <path d="M547 389H567" stroke="#101625" stroke-width="10" stroke-linecap="round"/>
  <path d="M228 412H549" stroke="#A71630" stroke-width="10" stroke-linecap="round"/>

  <!-- Wheels. -->
  <circle cx="295" cy="426" r="48" fill="#101625"/>
  <circle cx="295" cy="426" r="30" fill="#66758C"/>
  <circle cx="295" cy="426" r="20" fill="#E1E8F0"/>
  <circle cx="295" cy="426" r="9" fill="#66758C"/>
  <circle cx="495" cy="426" r="48" fill="#101625"/>
  <circle cx="495" cy="426" r="30" fill="#66758C"/>
  <circle cx="495" cy="426" r="20" fill="#E1E8F0"/>
  <circle cx="495" cy="426" r="9" fill="#66758C"/>
</svg>
