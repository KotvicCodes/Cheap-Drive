<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141413'/%3E%3Cpath d='M5 20.5h22l-2.6-7.2A3 3 0 0 0 21.6 11H10.4a3 3 0 0 0-2.8 2.3L5 20.5Z' fill='%23FF6200'/%3E%3Ccircle cx='10.5' cy='21' r='3.2' fill='%23FFD000'/%3E%3Ccircle cx='21.5' cy='21' r='3.2' fill='%23FFD000'/%3E%3C/svg%3E">
<title>Cheap-Drive</title>
<style>/* REPORT_CSS */</style>
</head>
<body>
<a class="skip" href="#main">Skip to report</a>
<aside class="sidebar">
  <div class="brand"><div class="brand-icon"><!-- BRAND --></div><div><strong>Cheap-Drive</strong></div></div>
  <div class="run-card" id="run-card"></div>
  <nav id="nav" aria-label="Report sections"></nav>
  <div class="side-bottom">
    <div class="export-row">
      <button id="export-source" type="button">↓ JSONL</button>
      <button id="export-model" type="button">↓ JSON</button>
    </div>
    <div class="offline" hidden><span class="dot" aria-hidden="true"></span>Offline</div>
    <p id="version" hidden></p>
  </div>
</aside>
<main id="main" tabindex="-1">
  <div id="demo-bar" class="demo-bar" hidden></div>
  <header class="topbar">
    <div><div class="eyebrow" id="run-label" hidden></div><h1 id="title">Overview</h1><p id="subtitle" hidden></p></div>
    <div class="top-actions"><span id="mode" class="badge lg"></span><button id="theme-toggle" class="theme-toggle" type="button"></button></div>
  </header>
  <div id="integrity-banner" class="integrity-banner" hidden></div>
  <section id="overview"></section>
  <section id="workspace" hidden>
    <div id="section-intro" class="section-intro"></div>
    <form id="filters" class="filters" role="search" autocomplete="off">
      <div class="filter-main">
        <label class="search"><span class="lbl">Search all captured fields</span><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="search" type="search" placeholder="Search order, gig, driver, note…"><kbd aria-hidden="true">/</kbd></label>
        <button id="filters-toggle" class="filters-toggle" type="button" aria-expanded="false" aria-controls="filter-grid">Filters</button>
        <button id="reset" type="button">Reset</button>
      </div>
      <div class="filter-grid" id="filter-grid">
        <label>Day<select id="day"><option value="">All days</option></select></label>
        <label>From<input id="from" type="time" aria-label="From clock time each day"></label>
        <label>To<input id="to" type="time" aria-label="To clock time each day"></label>
        <label>Kind<select id="kind"><option value="">All kinds</option></select></label>
        <label>State<select id="state"><option value="">All states</option></select></label>
      </div>
    </form>
    <div id="active-filters" class="chips" aria-label="Active filters"></div>
    <div id="distribution" class="distribution"></div>
    <div class="table-toolbar">
      <div><strong id="row-count" aria-live="polite"></strong><span id="sort-info"></span></div>
      <div><label>Rows <select id="page-size"><option>50</option><option>100</option><option>250</option></select></label><button id="export-filtered" type="button">↓ Export</button></div>
    </div>
    <div class="table-wrap"><table id="table"><thead></thead><tbody></tbody></table></div>
    <div id="empty" class="empty" hidden><strong>No matching records</strong><p>Reset filters to see all rows.</p></div>
    <div class="pagination">
      <span id="page-info"></span>
      <div><button id="first" type="button" aria-label="First page">«</button><button id="prev" type="button">‹ Prev</button><label>Page <input id="page-number" type="number" min="1" value="1"></label><span id="page-total"></span><button id="next" type="button">Next ›</button><button id="last" type="button" aria-label="Last page">»</button></div>
    </div>
    <p class="muted" id="filter-help" hidden></p>
  </section>
  <section id="captures" hidden></section>
  <footer hidden></footer>
</main>
<dialog id="detail" aria-labelledby="detail-title">
  <div class="dialog-top">
    <div><div id="detail-label" class="eyebrow"></div><h2 id="detail-title"></h2><div id="detail-crumbs"></div></div>
    <div class="dialog-actions"><button id="detail-back" type="button" hidden>‹ Back</button><button id="close-detail" type="button" aria-label="Close details">Close ×</button></div>
  </div>
  <div id="detail-body"></div>
</dialog>
<div id="tip" class="tip" hidden></div>
<script id="report-data" type="application/json">REPORT_DATA</script>
<script>/* REPORT_JS */</script>
</body>
</html>
