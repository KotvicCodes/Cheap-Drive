<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Video</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #141416;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    video {
      display: block;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      background: #141416;
    }
  </style>
</head>
<body>
  <video controls autoplay loop playsinline preload="auto" poster="poster.png" src="cheap-drive-demo.mp4">
    <track kind="captions" src="captions.vtt" srclang="en" label="English">
  </video>
</body>
</html>
