<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cheap-Drive - Demo Video</title>
  <style>
    :root {
      --bg-top: #FFB700;
      --bg-bot: #FF6200;
      --card: #FFFDF8;
      --ink: #141416;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 70% 35%, var(--bg-top), var(--bg-bot));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .stage {
      width: min(1280px, 96vw);
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 24px 60px rgba(20, 20, 22, 0.25);
    }
    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      background: #141416;
    }
  </style>
</head>
<body>
  <main class="stage">
    <video controls autoplay loop playsinline preload="auto" poster="poster.png?v=1685x" src="cheap-drive-demo.mp4?v=1685x">
      <track kind="captions" src="captions.vtt?v=1685x" srclang="en" label="English">
    </video>
  </main>
</body>
</html>
